<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Displaying Nested Lists</title>
</head>
<body bgcolor="lightyellow">
<font size="9" color="darkblue">
    <b>Example of Nested Lists</b>
</font>
<font size="5" color="darkgreen">
    <ol>
        <b><li>INPUT DEVICES</li></b>
        <UL>
            <li>Keyboard</li>
            <li>Mouse</li>
            <li>Scanner</li>
            <li>Joystick</li>
            <li>Digital Camera</li>
        </UL>
    </font><br>
    <font size="5" color="darkred">
        <li>OUTPUT DEVICES</li>
        <UL>
            <li>Monitor</li>
            <li>Printer</li>
            <li>Speaker</li>
            <li>Projector</li>
            <li>Headphones</li>
        </UL>
    </font>
    </ol>
    </body>
</html>
