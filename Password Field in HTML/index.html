<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Using Password And Radio Button</title>
</head>
<body bgcolor="lightpink">
<form>
    <font color="lightred" size="6">
    <h1><b>Using Password And Radio Button</b></h1></font>
    <font color="blue" size="5">
    <p>Enter Username: <input type="text" name="username"></p>
    <p>Enter Password: <input type="password" name="password"></p>
    <p>Select Gender:</p>
    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label><br>
    <input type="submit" value="Submit">
</font>
</form>
    
</body>
</html>
